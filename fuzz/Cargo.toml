# libFuzzer targets (cargo-fuzz layout): `cargo +nightly fuzz run <target>`. regressions/<target>/
# is replayed on stable by tools/ci/fuzz-replay.sh (ci.yml test job).
# Its own workspace: kept out of the main build and lockfile.
[package]
name = "wolos-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "GPL-2.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
shared = { path = "../crates/shared" }
shell = { path = "../crates/shell" }
wopkg = { path = "../crates/wopkg" }
wol-lua = { path = "../crates/wol-lua" }
wol = { path = "../crates/wol-abi", package = "wol-abi" }
wol_core = { path = "../crates/core", package = "core" }
wolkit = { path = "../crates/wolkit" }

[[bin]]
name = "ipc_decode"
path = "fuzz_targets/ipc_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "events"
path = "fuzz_targets/events.rs"
test = false
doc = false
bench = false

