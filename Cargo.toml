[workspace]
resolver = "3"
members = [
    "crates/shared",
    "crates/core",
    "crates/api",
    "crates/audio",
    "crates/realtime",
    "crates/proxy",
    "crates/controller",
    "crates/shell",
    "crates/wol-abi",
    "crates/wolkit",
    "crates/wolkit-render",
    "crates/wolkit-web",
    "crates/wol-lua",
    "crates/wopkg",
    "crates/xguard",
    "crates/xguard-clam",
    "crates/aurlaws",
    "crates/webengine",
    "crates/wolsem",
    "crates/federate",
    "crates/wolcrypt",
    "crates/wol-tor",
    "crates/atlas",
]
# The engine library's source (ADR 0042): built in the engine's own workspace by webengine-wolos.
exclude = ["crates/webengine/engine"]

[workspace.package]
version = "0.12.0"
edition = "2024"
license = "GPL-2.0-or-later"
authors = ["Julia Klee"]

[workspace.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: parsed numbers are exact, so an accepted wire line re-encodes to the same value.
serde_json = { version = "1", features = ["float_roundtrip"] }
# .wol signatures and hashes (ADR 0011).
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
sha2 = "0.10"
# Author certificates (ADR 0046): hybrid Ed25519 + ML-DSA-65 below the roots, Ed25519 + SLH-DSA-SHA2-128s for the roots.
# Pinned exactly (TRUST audit 1 M8 / audit 2 M7): a new release of either is reviewed and re-run against
# the vectors and tests/crosscheck.rs before it is taken; Cargo.lock holds each one's checksum.
fips204 = { version = "=0.5.0", default-features = false, features = ["ml-dsa-65"] }
fips205 = { version = "=0.5.0", default-features = false, features = ["slh-dsa-sha2-128s"] }
# Sealed messages (ADR 0046 "Encryption"): hybrid KEM X25519 + ML-KEM-768. X25519 is curve25519-dalek's
# Montgomery ladder (already in the tree under ed25519-dalek); ML-KEM-768 is fips203, of the same family as
# fips204/fips205. ChaCha20-Poly1305 and PBKDF2-HMAC-SHA512 are RustCrypto's (chacha20poly1305, pbkdf2), in
# crates/wolcrypt only (lead decision 2026-11-04 "WOLCRYPT": no ring).
fips203 = { version = "=0.5.0", default-features = false, features = ["ml-kem-768"] }
curve25519-dalek = { version = "4.1", default-features = false }
zeroize = { version = "1.8", default-features = false }
wolcrypt = { path = "crates/wolcrypt" }
shared = { path = "crates/shared" }
wol_core = { path = "crates/core", package = "core" }

# Vendored with a one-line idle-exit fix (docs/adr/0006-vendored-blocking-idle-exit.md).
[patch.crates-io]
blocking = { path = "third_party/blocking" }

# Release: thin LTO keeps most of fat LTO's speed at a fraction of the link time; 8 units trade a little
# code quality for parallel codegen (default is 16 without LTO, 1 with fat LTO).
[profile.release]
lto = "thin"
codegen-units = 8
strip = "debuginfo"

# The wolkit web module (crates/wolkit-web, site /kit/): small over fast, one unit, no unwinding.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
# wasm-bindgen strips the names itself and needs the target_features section kept.
strip = false
debug = false

# Dev: our crates stay fast to rebuild, dependencies (image, crypto, gtk bindings) are optimised once
# and cached; line tables are enough for backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
