# WolOS release image: mkarchiso (image/build.sh) in a privileged archlinux container, from the
# [wolos] repo the packages workflow published (built here if there is none yet). A tag `v*` first
# refreshes [wolos-cachy] (image/repo/mirror-cachy.sh, ADR 0019) as the `wolos-cachy-<snapshot>`
# release, then publishes the ISO, its .sha256 and release.json (+ release.json.sig) as the latest GitHub
# release: release.json is what `update-check` and `wol update` read. A manual run keeps the files
# as a workflow artifact.
# Signing: secret WOLOS_RELEASE_KEY (Ed25519 PEM, the package key), WOLOS_GPG_KEY for a rebuilt repo.
# Extra patches from $WOLOS_OVERLAY when present (vars.WOLOS_OVERLAY_REPO + secrets.WOLOS_OVERLAY_TOKEN).
name: iso

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write   # AWS build cluster (OIDC), when vars.AWS_ROLE_ARN is set

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # Releases (repo, ISO, release.json) live in a public repo anyone can download from:
      # vars.WOLOS_RELEASES_REPO with a token that may write there (this repo when unset).
      GH_REPO: ${{ vars.WOLOS_RELEASES_REPO || github.repository }}
      GH_TOKEN: ${{ secrets.WOLOS_RELEASES_TOKEN || github.token }}
      OVERLAY_REPO: ${{ vars.WOLOS_OVERLAY_REPO }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extra patches (when present)
        if: env.OVERLAY_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OVERLAY_REPO }}
          token: ${{ secrets.WOLOS_OVERLAY_TOKEN }}
          path: wolos-overlay

      - name: The [wolos] repo
        id: repo
        run: |
          snap=$(tr -d '[:space:]' < image/arch/snapshot)
          echo "snap=$snap" >> "$GITHUB_OUTPUT"
          mkdir -p out/repo/x86_64
          if gh release download "wolos-$snap" --dir out/repo/x86_64 && [ -s out/repo/x86_64/wolos.db ]; then
            cp out/repo/x86_64/revision out/repo/revision 2>/dev/null || true
            echo "have=1" >> "$GITHUB_OUTPUT"
          else
            rm -rf out/repo/x86_64/*   # none yet: image/build.sh builds it
          fi

      - name: The [wolos-cachy] repo (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GPG_KEY: ${{ secrets.WOLOS_GPG_KEY }}
        run: |
          tag=wolos-cachy-${{ steps.repo.outputs.snap }}
          mkdir -p out/cachy/x86_64
          # Resume: verified packages of the last refresh are kept, the rest is downloaded.
          gh release download "$tag" --dir out/cachy/x86_64 --pattern '*.pkg.tar.zst' 2>/dev/null || true
          docker run --rm -v "$PWD:/src" -w /src -e GPG_KEY archlinux:base-devel bash -euo pipefail -c '
            pacman -Syu --noconfirm --needed curl gnupg libarchive
            git config --global --add safe.directory "*"
            # Upstream signing keys by the fingerprints pinned in image/repo/cachy-trusted.
            g=$(mktemp -d)
            gpg --homedir "$g" --batch --keyserver hkps://keyserver.ubuntu.com --recv-keys $(cut -d: -f1 image/repo/cachy-trusted)
            gpg --homedir "$g" --batch --export > /tmp/upstream.gpg
            if [ -n "$GPG_KEY" ]; then
              echo "$GPG_KEY" | gpg --batch --import
              export WOLOS_SIGN_KEY=$(gpg --list-secret-keys --with-colons | awk -F: "/^fpr/ {print \$10; exit}")
            else
              export WOLOS_UNSIGNED=1
            fi
            WOLOS_CACHY_KEY=/tmp/upstream.gpg WOLOS_CACHY_DIR=/src/out/cachy image/repo/mirror-cachy.sh
          '
          sudo chown -R "$(id -u)" out/cachy
          cat out/cachy/sizes.txt >> "$GITHUB_STEP_SUMMARY"
          cd out/cachy/x86_64
          for l in wolos-cachy.db wolos-cachy.files wolos-cachy.db.sig wolos-cachy.files.sig; do
            [ -L "$l" ] && cp --remove-destination "$(readlink -f "$l")" "$l"
          done
          rm -f ./*.pkg.tar.zst.sig   # inside the database
          if find . -type f -size +2047M | grep -q .; then echo "::error::asset over 2 GiB"; exit 1; fi
          n=$(ls | wc -l); [ "$n" -le 1000 ] || { echo "::error::$n assets, GitHub keeps 1000"; exit 1; }
          echo "[wolos-cachy] $n assets, $(du -cb . | tail -1 | cut -f1) bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --title "[wolos-cachy] repo ($tag)" --notes "pacman repository" --latest=false
          gh release upload "$tag" --clobber ./*
          gh release view "$tag" --json assets -q '.assets[].name' | while read -r a; do
            [ -e "$a" ] || gh release delete-asset "$tag" "$a" --yes
          done

      - name: Cache pacman packages
        uses: actions/cache@v4
        with:
          path: out/pkgcache
          key: wolos-iso-${{ steps.repo.outputs.snap }}

      - name: mkarchiso in an archlinux container
        if: vars.AWS_ROLE_ARN == '' || steps.repo.outputs.have != '1'
        env:
          GPG_KEY: ${{ secrets.WOLOS_GPG_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          url=https://github.com/${{ vars.WOLOS_RELEASES_REPO || github.repository }}/releases/download/$TAG
          mkdir -p out/pkgcache
          docker run --rm --privileged -v "$PWD:/src" -w /src -v "$PWD/out/pkgcache:/var/cache/pacman/pkg" \
            -e GPG_KEY -e WOLOS_IMAGE_URL="$url" -e WOLOS_CACHY_DIR=/src/out/cachy archlinux:latest bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed archiso git base-devel sudo rust clang
              git config --global --add safe.directory "*"
              if [ ! -s out/repo/x86_64/wolos.db ]; then
                useradd -m builder; echo "builder ALL=(root) NOPASSWD: /usr/bin/pacman" > /etc/sudoers.d/builder
                chown -R builder /src
                ov=; [ -d /src/wolos-overlay ] && ov=/src/wolos-overlay
                sudo -u builder -H env GPG_KEY="$GPG_KEY" WOLOS_OVERLAY="$ov" bash -euo pipefail -c "
                  git config --global --add safe.directory \"*\"
                  if [ -n \"\$GPG_KEY\" ]; then
                    echo \"\$GPG_KEY\" | gpg --batch --import
                    export WOLOS_SIGN_KEY=\$(gpg --list-secret-keys --with-colons | awk -F: \"/^fpr/ {print \\\$10; exit}\")
                  else
                    export WOLOS_UNSIGNED=1
                  fi
                  [ -n \"\$WOLOS_OVERLAY\" ] || unset WOLOS_OVERLAY
                  WOLOS_INSTALL_DEPS=1 WOLOS_WORK=/src/out/work WOLOS_REPO_DIR=/src/out/repo image/repo/build.sh
                "
              fi
              WOLOS_WORK=/src/out/work WOLOS_REPO_DIR=/src/out/repo image/build.sh
            '

      # The build cluster: mkarchiso on a whole host, from the published repo.
      - name: AWS credentials
        if: vars.AWS_ROLE_ARN != '' && steps.repo.outputs.have == '1'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: mkarchiso on the build cluster
        if: vars.AWS_ROLE_ARN != '' && steps.repo.outputs.have == '1'
        env:
          CLUSTER: ${{ vars.CLUSTER }}
          TASK_DEF_ISO: ${{ vars.TASK_DEF_ISO }}
          CAPACITY: ${{ vars.CAPACITY }}
          BUCKET: ${{ vars.BUCKET }}
          WOLOS_IMAGE_URL: https://github.com/${{ vars.WOLOS_RELEASES_REPO || github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          [ -d out/cachy/x86_64 ] && export WOLOS_CACHY_DIR=out/cachy
          WOLOS_REPO_DIR=out/repo image/ci/aws-build.sh iso out/work/out

      - name: Release files
        env:
          KEY: ${{ secrets.WOLOS_RELEASE_KEY }}
        run: |
          sudo chown -R "$(id -u)" out
          mkdir -p dist
          iso=$(ls -t out/work/out/wolos-*.iso | head -1)
          mv "$iso" dist/
          cp "${iso%.iso}.json" dist/release.json   # release-manifest.sh, written by image/build.sh
          (cd dist && sha256sum "$(basename "$iso")" > "$(basename "$iso").sha256")
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > "$RUNNER_TEMP/release.pem"
            image/sign-release.sh dist/release.json "$RUNNER_TEMP/release.pem"
            rm -f "$RUNNER_TEMP/release.pem"
          else
            echo "::warning::no WOLOS_RELEASE_KEY: release.json unsigned, updates will not offer it"
          fi
          cat dist/release.json

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          files: |
            dist/*.iso
            dist/*.sha256
            dist/release.json
            dist/release.json.sig

      - name: Keep the image (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: wolos-iso
          path: dist/
          retention-days: 7
