# SPDX-License-Identifier: GPL-2.0-or-later
# The OS code: cargo test of the workspace, shellcheck and the standards checks (docs/STANDARDS.md:
# clippy, fmt, audit, script headers, ADR parts), on every pull request and push. The
# contract tests that read packaging or image files (crates/controller/tests/support/siblings.rs)
# find wolos-pkgbuilds and wolos-iso checked out next to this repo.
# On a push to main, wolos-pkgbuilds is told (repository_dispatch `wolos-main`) to pin the recipes
# built from wolos to this commit: its bump.yml opens a pull request. Nothing is built here.
# Secret: WOLOS_PKGBUILDS_TOKEN (may send repository_dispatch to wonderlandos/wolos-pkgbuilds).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest@sha256:e82623936fa1a69700b48e98b058df6eaab18b737c27473a7234a40fdecb9413 # bump: docker buildx imagetools inspect archlinux:latest
    steps:
      - name: Toolchain and the libraries the workspace links
        run: |
          pacman -Syu --noconfirm --needed git rust clang mold pkgconf gtk4 libadwaita gtk4-layer-shell \
            pam clamav nautilus crystal shellcheck python
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          path: wolos
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: wonderlandos/wolos-pkgbuilds
          path: wolos-pkgbuilds
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: wonderlandos/wolos-iso
          path: wolos-iso
      - name: cargo test
        # The whole workspace, every target (includes crates/shared/tests/unsafe_ratchet.rs and the
        # identity/exhaustion regression tests).
        working-directory: wolos
        run: cargo test --workspace --locked
      - name: Fuzz regressions (fuzz/regressions/<target>/ replayed on stable, no fuzzing)
        working-directory: wolos
        run: bash tools/ci/fuzz-replay.sh
      - name: shellcheck
        working-directory: wolos
        # The aurlaws fixtures are frozen inputs of the analyser (some are deliberately not valid scripts,
        # e.g. no shebang); they are read as bytes, never run, and must not be edited to please shellcheck.
        run: git ls-files -z -- '*.sh' ':(exclude)crates/aurlaws/tests/fixtures/**' | xargs -0 shellcheck -S error

  # docs/STANDARDS.md: the rules a machine can check. Separate from `test` so a style failure and a
  # test failure are told apart at a glance; same image so clippy links what the workspace links.
  lint:
    runs-on: ubuntu-latest
    container: archlinux:latest@sha256:e82623936fa1a69700b48e98b058df6eaab18b737c27473a7234a40fdecb9413 # bump: docker buildx imagetools inspect archlinux:latest
    steps:
      - name: Toolchain, the libraries the workspace links, cargo-audit, shellcheck
        run: |
          pacman -Syu --noconfirm --needed git rust clang mold pkgconf gtk4 libadwaita gtk4-layer-shell             pam clamav nautilus crystal shellcheck luacheck python librsvg cargo-audit cargo-deny
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: "cargo clippy (STANDARDS.md §1: -D warnings; the allow list lives here and in the document)"
        run: >
          cargo clippy --workspace --all-targets --locked --
          -D warnings
          -A clippy::too_many_arguments
          -A clippy::type_complexity
      - name: "cargo check, shell with the real layer-shell surfaces (the image builds with this feature)"
        run: cargo check -p shell --features layer-shell --all-targets --locked
      - name: Crystal format (wopkg, hue, the wol-abi bindings; the lint image's crystal is the reference)
        run: make -C wopkg fmt-check
      - name: Crystal lint (ameba with .ameba.yml; docs/RULES-crystal.md, tools/crystal/lint.sh)
        # ameba is built from a pinned commit of its source (v1.7.0, no dependencies, no shards): the
        # distribution package crashed at start against the current crystal. The script also repeats the
        # format check; a missing tool fails the step here instead of being skipped.
        env:
          WOLOS_REQUIRE_CRYSTAL_LINT: "1"
        run: |
          git init -q "$RUNNER_TEMP/ameba"
          git -C "$RUNNER_TEMP/ameba" fetch -q --depth 1 https://github.com/crystal-ameba/ameba 9a19f5f98abdf792a5a0ef6ca5c5d89459740e2f
          git -C "$RUNNER_TEMP/ameba" checkout -q FETCH_HEAD
          crystal build --no-debug -o /usr/local/bin/ameba "$RUNNER_TEMP/ameba/src/cli.cr"
          sh tools/crystal/lint.sh
      - name: cargo audit (RustSec advisories against Cargo.lock)
        # Ignored advisories go in .cargo/audit.toml (read by cargo-audit; deny.toml is cargo-deny's), each with a reason and a review date.
        run: cargo audit --deny warnings
      - name: cargo deny (advisories, licenses, bans, sources; deny.toml)
        run: cargo deny --locked check
      - name: "Shipped scripts: sh -n, SPDX and purpose header, shellcheck"
        run: |
          bash tools/check-headers.sh
          find files/usr/lib/wolos desktop/overlay/usr/bin -type f -exec grep -lZE '^#!/(usr/)?bin/(env )?(sh|bash)' {} + | xargs -0 -r shellcheck -S error
      - name: "Lua plugins and widgets: luacheck (.luacheckrc declares the wol global)"
        run: luacheck . --no-color
      - name: "Decision records: Status, Context, Decision, Consequences"
        run: bash tools/check-adrs.sh
      - name: "App icons: one source (design/icons/apps); the overlay PNGs are its renders, on one grid"
        run: python3 -I design/tools/icons/overlay.py --check
      - name: "Colour icons: the SVGs are what the vector generator draws now (build.py: checks, renders, no hand edits)"
        run: python3 -I design/tools/icons/build.py --check
      - name: "Colour icons through Qt: QtSvg (the renderer Qt apps load the theme with) draws every full-colour icon within RMSE 0.03 of librsvg at 48 and 128 px (qtcheck)"
        # A skip (exit 77: a tool missing) fails the step: here the tools are installed.
        run: |
          pacman -S --noconfirm --needed gcc qt6-svg
          bash design/tools/icons/qtcheck/check.sh
      - name: "Design tokens: colors.{json,css,sh} match tokens.py, the WCAG floors hold, no borrowed stock grey anywhere in the tree"
        run: python3 -I design/tools/tokens.py --check

  # Supply chain (audit A3/A4/B11): every `uses:` pinned to a commit SHA, every image to a digest,
  # in this repo and the two it checks out; actionlint on all their workflows.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: wolos
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: wonderlandos/wolos-pkgbuilds
          path: wolos-pkgbuilds
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: wonderlandos/wolos-iso
          path: wolos-iso
      - name: Pin lint self-test (fixtures, no network)
        run: python3 wolos/tools/ci/pin-lint.py --selftest
      - name: Pin lint (uses @sha, images @sha256)
        run: python3 wolos/tools/ci/pin-lint.py wolos wolos-pkgbuilds wolos-iso
      - name: Pin lint online (each pinned SHA is an upstream tag or branch head; network)
        run: python3 wolos/tools/ci/pin-lint.py --online wolos wolos-pkgbuilds wolos-iso
      - name: actionlint (pinned release, checked by sha256)
        run: |
          v=1.7.12
          curl -fsSLo "$RUNNER_TEMP/al.tgz" "https://github.com/rhysd/actionlint/releases/download/v$v/actionlint_${v}_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/al.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/al.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= wolos/.github/workflows/*.yml wolos-pkgbuilds/.github/workflows/*.yml             wolos-iso/.github/workflows/*.yml

  # docs/RULES-system.md RS-192: `Hyprland --verify-config` accepts the shipped compositor confs. The
  # compositor is Arch's hyprland 0.56.2-4 from the archive snapshot of 2026/10/27 (the last day it was
  # current; the fork in wolos-pkgbuilds is that version plus patches), so the job reads the same
  # syntax the image does. Hyprland refuses root, so it runs as a plain user; the confs `source` /usr/share/wolos
  # and ~/.cache/wolos/hypr-vm.conf, so the overlay is copied there and an empty vm file is made.
  # The seven `misc:` options below exist only in the fork's patches and `hyprbars:` fields belong to a
  # plugin that is not loaded here: those are the only errors let through; any other error fails.
  compositor-config:
    runs-on: ubuntu-latest
    container: archlinux:latest@sha256:e82623936fa1a69700b48e98b058df6eaab18b737c27473a7234a40fdecb9413 # bump: docker buildx imagetools inspect archlinux:latest
    # One snapshot install and four config checks (RC-005).
    timeout-minutes: 30
    steps:
      - name: The compositor (snapshot-pinned)
        # bash -eo pipefail, not the container's sh -e (RC-019).
        shell: bash
        run: |
          echo 'Server = https://archive.archlinux.org/repos/2026/10/27/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Syu --noconfirm --needed hyprland git
          v=$(pacman -Q hyprland)
          echo "$v"
          grep -q ' 0\.56\.2-' <<< "$v"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Hyprland --verify-config on the shipped confs
        # bash -eo pipefail (RC-019); the checks read $out from a here-string, so an early grep -q
        # exit cannot SIGPIPE a printf stage under pipefail.
        shell: bash
        run: |
          mkdir -p /usr/share/wolos
          cp -r desktop/overlay/usr/share/wolos/. /usr/share/wolos/
          useradd -m ci
          mkdir -p /home/ci/.cache/wolos /run/ci
          : > /home/ci/.cache/wolos/hypr-vm.conf
          chown -R ci /home/ci /run/ci
          chmod 700 /run/ci
          fork_only='misc:(throttle_occluded|throttle_window_count|throttle_occlusion_cutoff|throttle_freeze_ms|throttle_freeze_updates|reconfigure_ack_timeout_ms|frame_deadline)>|hyprbars:'
          bad=0
          for c in hyprland login installer setup; do
            out=$(runuser -u ci -- env HOME=/home/ci XDG_RUNTIME_DIR=/run/ci Hyprland --verify-config -c "/usr/share/wolos/hypr/$c.conf" 2>&1 || true)
            errors=$(grep -E 'Config error|unexpected symbol' <<< "$out" | grep -vE "$fork_only" || true)
            if [ -n "$errors" ] || ! grep -q 'config ok\|Config error' <<< "$out"; then
              tail -20 <<< "$out"
              echo "::error::$c.conf is not accepted"
              bad=1
            else
              echo "$c.conf: ok"
            fi
          done
          exit "$bad"

  # libFuzzer smoke run (audit B10): 60 s per target on a pinned nightly. A crash fails the job;
  # its input goes into fuzz/regressions/<target>/ so the test job replays it from then on.
  fuzz:
    runs-on: ubuntu-latest
    container: archlinux:latest@sha256:e82623936fa1a69700b48e98b058df6eaab18b737c27473a7234a40fdecb9413 # bump: docker buildx imagetools inspect archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        target: [ipc_decode, events, job_request, approval, hypr_ipc, wopkg_parsers, plugins_toml, lua_loader, package_call, core_parsers, wolplug_verify, plugin_index, wolkit_patch, wolkit_wsb, wolkit_wolcss]
    steps:
      - name: Toolchain (nightly pinned), cargo-fuzz, the libraries the shell links
        run: |
          pacman -Syu --noconfirm --needed git rustup clang mold pkgconf gtk4 libadwaita gtk4-layer-shell pam
          rustup toolchain install nightly-2026-11-01 --profile minimal
          cargo +nightly-2026-11-01 install --locked cargo-fuzz@0.13.2
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: cargo fuzz run ${{ matrix.target }} (60 s)
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          cargo +nightly-2026-11-01 fuzz run "$TARGET" "fuzz/corpus/$TARGET" "fuzz/regressions/$TARGET"             -- -max_total_time=60 -timeout=10 -rss_limit_mb=2048
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/

  # systemd-analyze security (audit section C): every shipped service at exposure <= 5.0 (threshold
  # 50). Informational (continue-on-error) until the unit hardening stream (H2) reports its units
  # done; then drop continue-on-error so a regression fails.
  units-security:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: systemd-analyze security --threshold=50
        run: |
          systemd-analyze --version | head -1
          systemd-analyze security --offline=true --threshold=50 --no-pager             files/usr/lib/systemd/system/*.service

  dispatch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Ask wolos-pkgbuilds to pin this commit
        env:
          GH_TOKEN: ${{ secrets.WOLOS_PKGBUILDS_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::WOLOS_PKGBUILDS_TOKEN is not set"; exit 1; }
          gh api repos/wonderlandos/wolos-pkgbuilds/dispatches -f event_type=wolos-main \
            -f "client_payload[sha]=$GITHUB_SHA"
