# WolOS power policy (archicture/modules/power.md): AC adapter plugged or unplugged -> the profile
# for the new source. Priority 20 replaces power_profile(8) (devd runs only the highest match); the
# policy also sets the deepest idle state it handled.
notify 20 {
	match "system"		"ACPI";
	match "subsystem"	"ACAD";
	action "/usr/local/bin/wol power apply";
};
