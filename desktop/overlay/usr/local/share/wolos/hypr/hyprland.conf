# WolOS system Hyprland defaults (macOS feel). Sourced by ~/.config/hypr/hyprland.conf.
# Override anything by adding lines after the `source` in the user file.
# Rule syntax targets Hyprland 0.53+ (`windowrule = match:<prop> <re>, <effect> <value>`); checked with `Hyprland --verify-config` on 0.56.2.
$mod = SUPER

# Compositor performance defaults (vfr, damage tracking, cached blur, HW cursor).
source = /usr/local/share/wolos/hypr/wolos-perf.conf
# Privacy: who may copy the screen, capture input or load plugins (wol_core::security).
source = /usr/local/share/wolos/hypr/permissions.conf

# Plugin: hyprbars (hyprland-plugins). Path set by the image build.
plugin = /usr/local/lib/hyprland/plugins/libhyprbars.so
# wol-hypr: placement + foreground QoS (plugins/wol-hypr).
plugin = /usr/local/lib/hyprland/plugins/libwol-hypr.so

exec-once = dbus-update-activation-environment --all
exec-once = gnome-keyring-daemon --start --components=secrets  # finishes the login keyring wol-login unlocked
exec-once = /usr/local/libexec/xdg-desktop-portal-hyprland
exec-once = lxqt-policykit-agent
exec-once = sh -c 'exec wol-shell 2>>"$XDG_RUNTIME_DIR/wol-shell.log"'
exec-once = sh -c 'wol theme set "$(wol theme)"'  # GTK/Qt/foot files + gsettings from the active theme
# User config (System Settings > Lock & Idle) wins over the system default.
exec-once = sh -c 'c="${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hypridle.conf"; [ -f "$c" ] || c=/usr/local/share/wolos/hypr/hypridle.conf; exec hypridle -c "$c"'

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = MOZ_ENABLE_WAYLAND,1
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24

monitor = , preferred, auto, 1

input {
    kb_layout = us
    follow_mouse = 2
    natural_scroll = true
    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
        disable_while_typing = true
    }
}

# 3-finger horizontal swipe switches space (0.51+ gesture syntax).
gesture = 3, horizontal, workspace
# 3-finger swipe up/down: Mission Control (wol-shell overview surface, ADR 0005).
gesture = 3, up, dispatcher, exec, wol shell show overview
gesture = 3, down, dispatcher, exec, wol shell hide overview

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 0
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 12
    blur {
        enabled = true
        size = 8
        passes = 3
        vibrancy = 0.2
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 30
        render_power = 3
        offset = 0 8
        color = rgba(00000059)
        color_inactive = rgba(00000033)
    }
}

animations {
    enabled = true
    # Same curves and durations as crates/realtime/src/anim.rs (speed in deciseconds).
    bezier = wolOut, 0.2, 0.8, 0.2, 1
    bezier = wolIn, 0.4, 0, 1, 1
    bezier = spring, 0.22, 1.2, 0.36, 1
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = windowsIn, 1, 2.2, wolOut, popin 90%
    animation = windowsOut, 1, 1.8, wolIn, popin 90%
    animation = windowsMove, 1, 4, spring
    animation = fade, 1, 3, ease
    animation = layers, 1, 3, ease, fade
    animation = workspaces, 1, 5, ease, slide
    animation = specialWorkspace, 1, 4, ease, slidevert
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    # hyprland-guiutils is not shipped: no "missing" banner (Hyprland nags are never shown to users).
    disable_hyprland_guiutils_check = true
    # One picture from the loader splash on (ADR 0012): black like the splash and the console.
    background_color = rgb(000000)
    # wol-lock's supervisor replaces a crashed lock screen; the session stays locked meanwhile.
    allow_session_lock_restore = true
    lockdead_screen_delay = 5000
}

# Floating by default, centered slightly high.
# Named so System Settings > Desktop & Dock > Tile windows can turn it off live
# (`windowrule[wol-float]:enable`); wol-float-apps keeps chosen apps floating while tiling.
windowrule {
    name = wol-float
    match:class = .*
    float = on
    size = (monitor_w*0.6) (monitor_h*0.65)
}
windowrule {
    name = wol-float-apps
    enable = false
    match:class = ^$
    float = on
}
# Placement: wol-hypr centres new floating windows slightly high (realtime placement.rs).
# GTK4/libadwaita draw their own title bar; wol-hypr tags them wol-csd.
windowrule = match:tag wol-csd, hyprbars:no_bar on

# Blur and fade for shell surfaces.
# Namespaces are regexes; ignore_alpha > 0 keeps blur off the transparent margins and shadows.
layerrule = match:namespace ^(wol-menubar|wol-dock|wol-panel-.*|wol-spotlight|wol-control-center)$, blur on
layerrule = match:namespace ^(wol-menubar|wol-dock|wol-panel-.*|wol-spotlight|wol-control-center)$, ignore_alpha 0.3
# The screenshot bar and thumbnail vanish at once: a fade-out would land in the capture.
layerrule = match:namespace ^(wol-panel-capture|wol-panel-capture-thumb)$, no_anim on

# macOS title bars: traffic lights left, title centered.
plugin {
    hyprbars {
        bar_height = 28
        bar_color = rgba(2c2c2ee6)
        col.text = rgba(f5f5f7ff)
        bar_text_font = Inter
        bar_text_size = 11
        bar_text_align = center
        bar_part_of_window = true
        bar_precedence_over_border = true
        bar_buttons_alignment = left
        bar_padding = 17
        bar_button_padding = 10
        # Added right-to-left in the button row: close ends leftmost.
        on_double_click = hyprctl dispatch fullscreen 1
        # Left alignment: first button is leftmost. Kit close/minimise/zoom (mid of light+dark).
        hyprbars-button = rgb(ff4035), 12, , hyprctl dispatch killactive
        hyprbars-button = rgb(ff9a05), 12, , hyprctl dispatch movetoworkspacesilent special:hidden
        hyprbars-button = rgb(32cc58), 12, , hyprctl dispatch fullscreen 1
    }
}

# Super is Command (⌘). Plain ⌘+letter belongs to the app in front; system shortcuts are macOS's.
# Apps / shell
bind = $mod, Space, exec, wol-spotlight
bind = $mod, Return, exec, foot
bind = $mod, comma, exec, wol-settings
bind = $mod, Escape, exec, wol shell toggle session
bind = $mod ALT, Escape, exec, wol shell toggle force-quit
# Keyboard into the menu bar and the Dock (macOS ⌃F2, ⌃F3); Esc gives it back.
bind = CTRL, F2, exec, wol shell show menubar
bind = CTRL, F3, exec, wol shell show dock
# Esc also dismisses notification banners; non-consuming, the app still gets its Esc.
bindn = , Escape, exec, wol shell hide banners
# Mission Control: ⌃↑ (macOS), ⌘↑ too.
bind = CTRL, Up, exec, wol shell toggle overview
bind = $mod, Up, exec, wol shell toggle overview
# App switcher: hold Super, tap Tab (Shift reverses); releasing Super focuses the selection.
bind = $mod, Tab, exec, wol shell show switcher
bind = $mod SHIFT, Tab, exec, wol shell show switcher-prev
bindrt = $mod, SUPER_L, exec, wol shell hide switcher
bind = CTRL $mod, Q, exec, wol-lock

# App commands: wol-app taps the app's own key (Ctrl+C; a terminal's Ctrl+Shift+C), appmenu::send.
bind = $mod, C, exec, wol-app copy
binde = $mod, V, exec, wol-app paste
bind = $mod, X, exec, wol-app cut
binde = $mod, Z, exec, wol-app undo
binde = $mod SHIFT, Z, exec, wol-app redo
bind = $mod, A, exec, wol-app select-all
bind = $mod, S, exec, wol-app save
bind = $mod, O, exec, wol-app open
bind = $mod, P, exec, wol-app print
bind = $mod, F, exec, wol-app find
binde = $mod, G, exec, wol-app find-next
bind = $mod, T, exec, wol-app new-tab
bind = $mod, W, exec, wol-app close
bind = $mod, N, exec, wol-app new
bind = $mod, R, exec, wol-app reload
bind = $mod, L, exec, wol-app location
binde = $mod, equal, exec, wol-app zoom-in
binde = $mod, minus, exec, wol-app zoom-out
bind = $mod, 0, exec, wol-app actual-size
bind = CTRL $mod, Space, exec, wol-app emoji

# Windows (Cmd semantics)
# App actions shared with the menu bar app/Window menus (wol-app).
bind = $mod, Q, exec, wol-app quit
bind = $mod, H, exec, wol-app hide
bind = $mod ALT, H, exec, wol-app hide-others
bind = $mod, M, exec, wol-app minimise
bind = $mod SHIFT, H, togglespecialworkspace, hidden
bind = CTRL $mod, F, fullscreen, 0
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Screenshots: 3 full, 4 region, 5 region to clipboard
bind = $mod SHIFT, 3, exec, wol-screenshot full
bind = $mod SHIFT, 4, exec, wol-screenshot region
bind = $mod SHIFT, 5, exec, wol shell show screenshot
bind = , Print, exec, wol-screenshot full

# Accessibility: zoom around the pointer (macOS ⌥⌘8, ⌥⌘=, ⌥⌘-).
bind = $mod ALT, 8, exec, wol-zoom toggle
binde = $mod ALT, equal, exec, wol-zoom in
binde = $mod ALT, minus, exec, wol-zoom out

# Spaces
bind = CTRL, Left, workspace, e-1
bind = CTRL, Right, workspace, e+1
bind = CTRL, 1, workspace, 1
bind = CTRL, 2, workspace, 2
bind = CTRL, 3, workspace, 3
bind = CTRL, 4, workspace, 4

# Media
bindel = , XF86AudioRaiseVolume, exec, wol-volume up
bindel = , XF86AudioLowerVolume, exec, wol-volume down
bindl = , XF86AudioMute, exec, wol-volume mute
bindel = , XF86MonBrightnessUp, exec, backlight incr 5
bindel = , XF86MonBrightnessDown, exec, backlight decr 5
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# System Settings > Keyboard > Shortcuts records a new shortcut in this submap: WolOS shortcuts pause so
# the keys reach Settings. Esc (non-consuming) always returns.
submap = wol-record
bindn = , escape, submap, reset
submap = reset
