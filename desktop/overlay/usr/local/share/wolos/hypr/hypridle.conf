general {
    lock_cmd = pgrep -x wol-lock || wol-lock
    before_sleep_cmd = pgrep -x wol-lock || wol-lock
    after_sleep_cmd = hyprctl dispatch dpms on
}
listener {
    timeout = 300
    on-timeout = pgrep -x wol-lock || wol-lock
}
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
listener {
    timeout = 120
    on-timeout = wol power idle display-off
    on-resume = hyprctl dispatch dpms on
}
listener {
    timeout = 600
    on-timeout = wol power idle sleep
}
