# WolOS tiling shortcuts. Not sourced directly: while System Settings > Desktop & Dock > Tile windows
# is on, Settings binds these (with any changes from Keyboard > Shortcuts) in ~/.config/hypr/wolos/shortcuts.conf.
$mod = SUPER

bind = $mod ALT, left, movefocus, l
bind = $mod ALT, right, movefocus, r
bind = $mod ALT, up, movefocus, u
bind = $mod ALT, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d
binde = $mod CTRL, left, resizeactive, -40 0
binde = $mod CTRL, right, resizeactive, 40 0
binde = $mod CTRL, up, resizeactive, 0 -40
binde = $mod CTRL, down, resizeactive, 0 40
# Float one window out of the tiling (⌘F is Find in apps).
bind = $mod ALT, F, togglefloating
