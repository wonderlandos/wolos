# WolOS firewall (Settings > Network > Firewall; rc.conf pf_rules). Nothing comes in unasked;
# replies to this machine's own traffic pass through its state. Last matching rule wins.
set skip on lo0
block in all
pass out all keep state
# Ping and "unreachable" (path MTU discovery needs fragmentation-needed).
pass in inet proto icmp icmp-type { echoreq, unreach }
# IPv6 does not work without neighbour discovery and router advertisements; too-big is its path MTU.
pass in inet6 proto icmp6 icmp6-type { echoreq, unreach, toobig, neighbrsol, neighbradv, routeradv }
# DHCP: the server answers the lease request.
pass in inet proto udp from port 67 to port 68
# mDNS: printers and other devices on the local network announce themselves.
pass in proto udp to port 5353
