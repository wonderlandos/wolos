# WolOS window buttons (hyprbars), sourced once by /usr/share/wolos/hypr/hyprland.conf.
# Left alignment: first button is leftmost. Kit close/minimise/zoom (mid of light+dark).
# close/minimize/zoom act on the bar's own window when released over the button.
plugin {
    hyprbars {
        hyprbars-button = rgb(ff4035), 12, ×, close, rgba(4d0000cc)
        hyprbars-button = rgb(ff9a05), 12, −, minimize, rgba(5a3300cc)
        hyprbars-button = rgb(32cc58), 12, +, zoom, rgba(00460acc)
    }
}
