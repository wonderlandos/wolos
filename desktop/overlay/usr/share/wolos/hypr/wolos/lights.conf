# WolOS window buttons (hyprbars), sourced once by /usr/share/wolos/hypr/hyprland.conf.
# One quiet neutral circle for all three (the Kit's idle window control, a mid violet grey that
# reads on the light and the dark bar), ink glyphs close x, minimise -, zoom [] shown while the
# pointer is over the group. Left alignment: first button is leftmost. The client-side controls
# (GTK 3/4, Firefox, Kit) take the accent on the hovered circle: crates/core/src/theme/apps.rs.
# close/minimize/zoom act on the bar's own window when released over the button.
plugin {
    hyprbars {
        hyprbars-button = rgb(8f8da8), 12, ×, close, rgba(221b36ff)
        hyprbars-button = rgb(8f8da8), 12, −, minimize, rgba(221b36ff)
        hyprbars-button = rgb(8f8da8), 12, □, zoom, rgba(221b36ff)
    }
}
