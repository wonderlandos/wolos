# Login window compositor (wol-greeter-session). Exiting wol-loginwindow restarts the greeter.
# Scale 1 like the desktop session (hyprland.conf): without a rule Hyprland picks a scale from
# the display's size, and a VM display at 1.5 left the welcome card taller than the screen.
monitor = , preferred, auto, 1
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    # No compositor nags: guiutils is not shipped; wol-login restarts this Hyprland (no start-hyprland).
    disable_hyprland_guiutils_check = true
    disable_watchdog_warning = true
    # Black like the loader splash and the console (ADR 0012).
    background_color = rgb(000000)
}
# No pointer over the black first frames; the window shows it after its own first frame (kit::Reveal).
# The pointer the desktop uses (adwaita-cursors, a dependency of adwaita-icon-theme).
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
cursor {
    invisible = true
}
decoration {
    rounding = 12
}
animations {
    enabled = false
}
# Compositor and UI run as _wollogin (wol-greeter-session).
exec = sh -c 'systemd-detect-virt -q --vm && hyprctl keyword cursor:no_hardware_cursors 1'  # VM GPUs (vmwgfx): no pointer on the cursor plane, draw it
exec-once = sh -c '[ "$(systemd-detect-virt)" = oracle ] && exec VBoxClient --vmsvga'  # VirtualBox: resize with the VM window
exec-once = /usr/bin/wol-loginwindow; hyprctl dispatch exit

# Whole-frame redraws: with damage tracking a page fade's last frame was never repainted (VM).
debug {
    damage_tracking = 0
}
