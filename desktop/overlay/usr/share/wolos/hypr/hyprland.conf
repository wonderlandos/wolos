# WolOS system compositor defaults (the WolOS desktop feel). Sourced by ~/.config/hypr/hyprland.conf.
# Override anything by adding lines after the `source` in the user file.
# Rule syntax targets the compositor 0.53+ (`windowrule = match:<prop> <re>, <effect> <value>`); checked with `Hyprland --verify-config` on 0.56.2.
$mod = SUPER

# Compositor performance defaults (vfr, damage tracking, cached blur, HW cursor).
source = /usr/share/wolos/hypr/wolos-perf.conf
# Privacy: who may copy the screen, capture input or load plugins (wol_core::security).
source = /usr/share/wolos/hypr/permissions.conf

# Plugin: hyprbars (hyprland-plugins). Path set by the image build.
plugin = /usr/lib/hyprland/plugins/libhyprbars.so
# wol-hypr: placement + foreground QoS (plugins/wol-hypr).
plugin = /usr/lib/hyprland/plugins/libwol-hypr.so

exec = sh -c 'systemd-detect-virt -q --vm && hyprctl keyword cursor:no_hardware_cursors 1'  # VM GPUs (vmwgfx): no pointer on the cursor plane, draw it (exec: again after hyprctl reload)
# The same as a setting (wol-session writes it each start; reload keeps it, no frame with the plane).
source = ~/.cache/wolos/hypr-vm.conf
exec-once = wol-vbox-guest  # VirtualBox: resize with the VM window, clipboard, drag and drop (only under VirtualBox)
# --systemd: the systemd user manager gets DISPLAY/WAYLAND_DISPLAY too, whichever D-Bus daemon runs.
exec-once = sh -c 'dbus-update-activation-environment --systemd --all; systemctl --user restart wolos-session.target'
# The portal and the accessibility bus start now, in parallel with the shell: GTK waits for the portal
# registry at display open (2.8 s warm, 10 s at first boot, QA-100 H17-03).
exec-once = systemctl --user start --no-block xdg-desktop-portal.service xdg-desktop-portal-gtk.service xdg-desktop-portal-hyprland.service at-spi-dbus-bus.service
# X11 apps follow the monitor scale: Xft.dpi, Xcursor.size, GDK_SCALE, Steam UI (exec: again after hyprctl reload).
exec = wol-x11-env
# Xwayland has no auth cookie: only this account's X11 clients may connect (other users, root).
exec-once = sh -c 'xhost +si:localuser:"$(id -un)" && xhost -local: && xhost -'
exec-once = gnome-keyring-daemon --start --components=secrets  # finishes the login keyring wol-login unlocked
# Input method (wolos-module-ime): nothing in this session runs /etc/xdg/autostart, so start it here.
exec-once = sh -c '[ -x /usr/bin/fcitx5 ] && exec fcitx5 -d'
exec-once = sh -c '[ -e "$XDG_RUNTIME_DIR/wol-first-login" ] && wol-setup --first-login; exec wol-shell --supervised 2>>"$XDG_RUNTIME_DIR/wol-shell.log"'
exec-once = wol theme apply  # GTK/Qt/foot files + gsettings from the theme in use; saves nothing (QA-SET-63)
# Live: the account gets Flathub (QA-FDAY-11); /var/lib/flatpak is not there, so flatpak in a terminal saw no remote.
exec-once = sh -c '[ -e /etc/wolos-live ] && exec flatpak remote-add --user --if-not-exists flathub /etc/flatpak/remotes.d/flathub.flatpakrepo'

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
# Qt on Wayland; an app without the Wayland plugin (old Qt 5, AppImages) falls back to X11.
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = MOZ_ENABLE_WAYLAND,1
# Java/AWT (JetBrains, Android Studio, Swing) under Xwayland: the compositor does not reparent windows.
env = _JAVA_AWT_WM_NONREPARENTING,1
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
# The compositor's own pointer (hyprcursor) follows the same theme and size; a theme without a hyprcursor
# build falls back to the Xcursor one. Settings > Accessibility writes the same four values.
env = HYPRCURSOR_THEME,Adwaita
env = HYPRCURSOR_SIZE,24

monitor = , preferred, auto, 1

input {
    kb_layout = us
    follow_mouse = 2
    natural_scroll = true
    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
        disable_while_typing = true
    }
}

# 3-finger horizontal swipe switches space (0.51+ gesture syntax).
gesture = 3, horizontal, workspace
# 3-finger swipe up/down: Overview (wol-shell overview surface, ADR 0005).
gesture = 3, up, dispatcher, exec, wol shell show overview
gesture = 3, down, dispatcher, exec, wol shell hide overview

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 0
    layout = dwindle
    resize_on_border = true
}

# Zoom (maximise, `fullscreenstate 1 -1`) fills the band between the menu bar and the Dock exactly:
# no gaps, square corners, like a zoomed window. f[1] = a workspace whose fullscreen window
# is maximised.
workspace = f[1], gapsout:0, gapsin:0, rounding:false

decoration {
    rounding = 12
    blur {
        enabled = true
        size = 8
        passes = 3
        vibrancy = 0.2
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 30
        render_power = 3
        offset = 0 8
        # color, color_inactive: the theme (hypr/wolos/theme.conf below).
    }
}

animations {
    enabled = true
    # Same curves and durations as crates/realtime/src/anim.rs (speed in deciseconds).
    bezier = wolOut, 0.2, 0.8, 0.2, 1
    bezier = wolIn, 0.4, 0, 1, 1
    bezier = spring, 0.22, 1.2, 0.36, 1
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = windowsIn, 1, 2.2, wolOut, popin 90%
    animation = windowsOut, 1, 1.8, wolIn, popin 90%
    animation = windowsMove, 1, 2, spring
    animation = fade, 1, 3, ease
    animation = layers, 1, 3, ease, fade
    animation = workspaces, 1, 5, ease, slide
    animation = specialWorkspace, 1, 4, ease, slidevert
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    # X11 _NET_ACTIVE_WINDOW carries no activation token: a Steam or Wine pop-up took the keyboard
    # mid-typing (ADR 0027). A window asking for focus is marked urgent; the Dock shows it.
    focus_on_activate = false
    # hyprland-guiutils is not shipped: no "missing" banner (compositor nags are never shown to users).
    disable_hyprland_guiutils_check = true
    # One picture from the loader splash on (ADR 0012): black like the splash and the console.
    background_color = rgb(000000)
    # wol-lock's supervisor replaces a crashed lock screen; the session stays locked meanwhile.
    allow_session_lock_restore = true
    lockdead_screen_delay = 5000
}

# Floating by default. Size and position come from wol-hypr (realtime placement.rs): a window keeps
# the size it asked for, cut to the usable area; dialogs centre on their parent. A `size` rule here
# hit dialogs and fixed-size windows too, which flashed at the wrong size.
# Named so System Settings > Desktop & Dock > Tile windows can turn it off live
# (`windowrule[wol-float]:enable`); wol-float-apps keeps chosen apps floating while tiling.
windowrule {
    name = wol-float
    match:class = .*
    float = on
}
windowrule {
    name = wol-float-apps
    enable = false
    match:class = ^$
    float = on
}
# The terminal is opaque (QA-LIVE-12): foot's own `alpha` (the theme's 0.9 glass look) lets the windows behind
# it bleed through the text where the compositor has no blur. `opaque` drops the buffer's alpha.
windowrule {
    name = wol-terminal-opaque
    match:class = ^(foot|footclient)$
    opaque = on
}
# The polkit password dialog (pkexec, Files, disks) stays on top and keeps the keyboard until it is
# answered: once another window was focused nothing brought it back, and the password typed next
# landed in the terminal and its history (QA-LIVE-38; interim until a WolOS agent).
windowrule {
    name = wol-polkit-agent
    match:class = ^(lxqt-policykit-agent)$
    float = on
    center = on
    pin = on
    stay_focused = on
    dim_around = on
}
# Placement: wol-hypr centres new floating windows slightly high (realtime placement.rs).
# One set of window buttons per window (realtime chrome.rs): wol-hypr tags windows that draw their
# own (no strip) and fixed-size dialogs (close only).
windowrule = match:tag wol-lights-none, hyprbars:no_bar on
windowrule = match:tag wol-lights-close, hyprbars:buttons 1

# Blur and fade for shell surfaces.
# Namespaces are regexes; ignore_alpha > 0 keeps blur off the transparent margins and shadows.
# Search (wol-panel-searchbar) and Control Center (wol-panel-controlcenter) are resident wol-shell panels.
layerrule = match:namespace ^(wol-menubar|wol-dock|wol-panel-.*)$, blur on
layerrule = match:namespace ^(wol-menubar|wol-dock|wol-panel-.*)$, ignore_alpha 0.3
# The screenshot bar and thumbnail vanish at once: a fade-out would land in the capture.
layerrule = match:namespace ^(wol-panel-capture|wol-panel-capture-thumb)$, no_anim on

# Title bars: window buttons right (close at the edge, then zoom, minimise), title centered.
plugin {
    hyprbars {
        bar_height = 28
        # Colours (bar, title, the inactive look) come from the theme: hypr/wolos/theme.conf below.
        bar_text_font = Inter
        bar_text_size = 11
        bar_text_align = center
        bar_part_of_window = true
        bar_precedence_over_border = true
        bar_buttons_alignment = right
        bar_padding = 17
        bar_button_padding = 10
        on_double_click = zoom
        # Pointer over any button: glyphs on all three.
        icon_on_hover = true
    }
}
# The window buttons (Kit close/minimise/zoom), sourced once: each line adds a button.
source = /usr/share/wolos/hypr/wolos/lights.conf
# Every colour is the theme's (wol_core::theme::hypr): this is the default theme's render;
# `wol theme set` writes ~/.config/hypr/wolos/theme.conf (user conf glob, read after this file)
# and sets the same keys live.
source = /usr/share/wolos/hypr/wolos/theme.conf

# Super is Command (⌘). Plain ⌘+letter belongs to the app in front; system shortcuts are the WolOS ones.
# Apps / shell
bind = $mod, Space, exec, wol-search
bind = $mod, Return, exec, foot
bind = $mod, comma, exec, wol-settings
bind = $mod, Escape, exec, wol shell toggle session
bind = $mod ALT, Escape, exec, wol shell toggle force-quit
# Every shortcut on one sheet (the ⌘? help key).
bind = $mod SHIFT, slash, exec, wol shell toggle shortcuts
# Keyboard into the menu bar and the Dock (⌃F2, ⌃F3); Esc gives it back.
bind = CTRL, F2, exec, wol shell show menubar
bind = CTRL, F3, exec, wol shell show dock
# The two panels without a pointer (QA-ACC-7): ⌃⌘C Control Center, ⌃⌘A Notification Center (Alerts).
bind = CTRL $mod, C, exec, wol shell toggle control-center
bind = CTRL $mod, A, exec, wol shell toggle notifications
# Esc closes menus and panels and dismisses notification banners, and releasing Super finishes ⌘Tab:
# no binds. The wol-hypr plugin forwards Esc (`hide transient`) and the Super release (`hide
# switcher`) to the shell socket only while a shell layer is on screen, without a process; the app
# still gets its keys (audit3 R2A-10: a `wol` process per Esc in every app, games included).
# Overview: ⌃↑, ⌘↑ too.
bind = CTRL, Up, exec, wol shell toggle overview
bind = $mod, Up, exec, wol shell toggle overview
# App switcher: hold Super, tap Tab (Shift reverses); releasing Super focuses the selection (wol-hypr).
bind = $mod, Tab, exec, wol shell show switcher
bind = $mod SHIFT, Tab, exec, wol shell show switcher-prev
bind = CTRL $mod, Q, exec, wol-lock

# App commands: wol-app taps the app's own key (Ctrl+C; a terminal's Ctrl+Shift+C), appmenu::send.
bind = $mod, C, exec, wol-app copy
binde = $mod, V, exec, wol-app paste
bind = $mod, X, exec, wol-app cut
binde = $mod, Z, exec, wol-app undo
binde = $mod SHIFT, Z, exec, wol-app redo
bind = $mod, A, exec, wol-app select-all
bind = $mod, S, exec, wol-app save
bind = $mod, O, exec, wol-app open
bind = $mod, P, exec, wol-app print
bind = $mod, F, exec, wol-app find
binde = $mod, G, exec, wol-app find-next
bind = $mod, T, exec, wol-app new-tab
bind = $mod, W, exec, wol-app close
bind = $mod, N, exec, wol-app new
bind = $mod, R, exec, wol-app reload
bind = $mod, L, exec, wol-app location
binde = $mod, equal, exec, wol-app zoom-in
binde = $mod, minus, exec, wol-app zoom-out
bind = $mod, 0, exec, wol-app actual-size
bind = CTRL $mod, Space, exec, wol-app emoji
# Clipboard history (⇧⌘V, the common clipboard-manager key).
bind = $mod SHIFT, V, exec, wol shell toggle clipboard
# Theme picker (ADR 0031 themes v2): every theme as a preview card.
bind = CTRL $mod, T, exec, wol shell toggle themes

# Windows (Cmd semantics)
# App actions shared with the menu bar app/Window menus (wol-app).
bind = $mod, Q, exec, wol-app quit
bind = $mod, H, exec, wol-app hide
bind = $mod ALT, H, exec, wol-app hide-others
bind = $mod, M, exec, wol-app minimise
# (no ⇧⌘H: it showed special:hidden, every minimised window at once, as an overlay; minimised
# windows come back through the Dock, the switcher or app activation: fork patch 0008.)
bind = CTRL $mod, F, fullscreen, 0
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Screenshots: 3 full, 4 region, 5 region to clipboard
bind = $mod SHIFT, 3, exec, wol-screenshot full
bind = $mod SHIFT, 4, exec, wol-screenshot region
bind = $mod SHIFT, 5, exec, wol shell show screenshot
bind = , Print, exec, wol-screenshot full
# Copy to the clipboard instead of saving (Control with the same keys).
bind = CTRL $mod SHIFT, 3, exec, wol-screenshot full --copy
bind = CTRL $mod SHIFT, 4, exec, wol-screenshot clip

# Accessibility: zoom around the pointer (⌥⌘8, ⌥⌘=, ⌥⌘-).
bind = $mod ALT, 8, exec, wol-zoom toggle
binde = $mod ALT, equal, exec, wol-zoom in
binde = $mod ALT, minus, exec, wol-zoom out

# Spaces: ⌃⌥←/→ and ⌃⌥1..4 (the GNOME keys). Not plain ⌃: apps own Ctrl+arrows (word-wise cursor)
# and Ctrl+1..9 (browser tabs), and Super is ⌘ here, so ⌃ alone is the app's key. Not ⌃⌘: tiling.conf
# resizes with ⌃⌘arrows. Known overlap (audit3 R2A-6): JetBrains IDEs (Navigate Back/Forward) and
# VS Code (move editor between groups) use ⌃⌥←/→ too and lose them here; Settings > Keyboard rebinds.
bind = CTRL ALT, Left, workspace, e-1
bind = CTRL ALT, Right, workspace, e+1
bind = CTRL ALT, 1, workspace, 1
bind = CTRL ALT, 2, workspace, 2
bind = CTRL ALT, 3, workspace, 3
bind = CTRL ALT, 4, workspace, 4

# Moving a window (QA-PWR-11): ⌃⌥⇧←/→ and ⌃⌥⇧1..4 send the focused window to another space (the
# same keys as switching, plus ⇧); ⌃⌥⌘←/→ send it to the display on that side. hyprctl does the
# move so the .conf and .lua forms are one text (units.rs hypr_conf_and_lua_bind_sets_equal).
bind = CTRL ALT SHIFT, Left, exec, hyprctl dispatch movetoworkspace e-1
bind = CTRL ALT SHIFT, Right, exec, hyprctl dispatch movetoworkspace e+1
bind = CTRL ALT SHIFT, 1, exec, hyprctl dispatch movetoworkspace 1
bind = CTRL ALT SHIFT, 2, exec, hyprctl dispatch movetoworkspace 2
bind = CTRL ALT SHIFT, 3, exec, hyprctl dispatch movetoworkspace 3
bind = CTRL ALT SHIFT, 4, exec, hyprctl dispatch movetoworkspace 4
bind = CTRL ALT $mod, Left, exec, hyprctl dispatch movewindow mon:l
bind = CTRL ALT $mod, Right, exec, hyprctl dispatch movewindow mon:r

# Toggles (wol toggle, ADR 0031 W5): each key flips the state.
bind = CTRL $mod, N, exec, wol toggle nightlight
bind = CTRL $mod, D, exec, wol toggle dnd
bind = CTRL $mod, I, exec, wol toggle stay-awake

# Media
bindel = , XF86AudioRaiseVolume, exec, wol-volume up
bindel = , XF86AudioLowerVolume, exec, wol-volume down
bindl = , XF86AudioMute, exec, wol-volume mute
bindl = , XF86AudioMicMute, exec, wol-volume micmute
bindel = , XF86MonBrightnessUp, exec, wol-backlight up
bindel = , XF86MonBrightnessDown, exec, wol-backlight down
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# System Settings > Keyboard > Shortcuts records a new shortcut in this submap: WolOS shortcuts pause so
# the keys reach Settings. Esc (non-consuming) always returns.
submap = wol-record
bindn = , escape, submap, reset
submap = reset
