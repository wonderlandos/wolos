# WolOS privacy (archicture/modules/security.md): who may copy the screen, capture input
# or load compositor plugins. Generated by wol_core::security::hypr_permissions.
ecosystem {
    enforce_permissions = true
}
permission = ^/usr/lib/xdg-desktop-portal-hyprland$, screencopy, allow
permission = ^/usr/lib/xdg-desktop-portal-hyprland$, cursorpos, allow
permission = ^/usr/bin/grim$, screencopy, allow
permission = ^/usr/bin/grim$, cursorpos, allow
permission = ^/usr/bin/wf-recorder$, screencopy, allow
permission = ^/usr/bin/wf-recorder$, cursorpos, allow
permission = ^/usr/bin/wol-window-shot$, screencopy, allow
permission = ^/usr/bin/wol-window-shot$, cursorpos, allow
permission = ^/usr/bin/wol-shell$, screencopy, allow
permission = ^/usr/bin/wol-shell$, cursorpos, allow
permission = .*, screencopy, deny
permission = .*, cursorpos, deny
permission = .*, input-capture, deny
permission = ^/usr/lib/hyprland/plugins/[^/]+\.so$, plugin, allow
permission = .*, plugin, deny
