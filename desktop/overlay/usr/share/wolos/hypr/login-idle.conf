# The login window's idle handling (login.conf / login.lua start hypridle on this file): the
# greeter turns the display off after 10 minutes untouched and back on at the first key or
# pointer move (QA-FILES-10: it used to burn the panel all night). No lock, no sleep: nobody is
# signed in, and a suspend here would not wake for a remote session.
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
