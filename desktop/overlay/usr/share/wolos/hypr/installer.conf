# First screen of the live image (installer-session, ADR 0023): Install WolOS alone, no shell.
# Scale 1 like the desktop session (hyprland.conf): without a rule Hyprland picks a scale from
# the display's size, and a VM display at 1.5 left the welcome card taller than the screen.
monitor = , preferred, auto, 1
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_hyprland_guiutils_check = true
    disable_watchdog_warning = true
    background_color = rgb(000000)
}
cursor {
    invisible = true
}
decoration {
    rounding = 12
}
animations {
    enabled = false
}
exec-once = sh -c '[ "$(systemd-detect-virt)" = oracle ] && exec VBoxClient --vmsvga'  # VirtualBox: resize with the VM window
exec-once = /usr/bin/wol-installer --boot; hyprctl dispatch exit

debug {
    damage_tracking = 0
}
