# First screen of the live image (installer-session, ADR 0023): Install WolOS alone, no shell.
# Scale 1 like the desktop session (hyprland.conf): without a rule the compositor picks a scale from
# the display's size, and a VM display at 1.5 left the welcome card taller than the screen.
monitor = , preferred, auto, 1
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_hyprland_guiutils_check = true
    disable_watchdog_warning = true
    background_color = rgb(000000)
}
# The pointer the desktop uses (adwaita-cursors, a dependency of adwaita-icon-theme).
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
# Pointer shown from the start: Install WolOS opens over the live desktop (no kit::Reveal from
# black), so nothing would ever unhide a `cursor:invisible` here (VirtualBox: no pointer at all).
decoration {
    rounding = 12
}
animations {
    enabled = false
}
exec = sh -c 'systemd-detect-virt -q --vm && hyprctl keyword cursor:no_hardware_cursors 1'  # VM GPUs (vmwgfx): no pointer on the cursor plane, draw it
exec-once = wol-vbox-guest  # VirtualBox: resize with the VM window, clipboard, drag and drop (only under VirtualBox)
exec-once = /usr/bin/wol-installer --boot; hyprctl dispatch dpms off; hyprctl dispatch exit  # output off first: no stale Welcome card in the last scanout (QA-SHEET-2)

debug {
    damage_tracking = 0
}
