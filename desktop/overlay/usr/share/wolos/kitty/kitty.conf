# WolOS kitty defaults (ADR 0032 "Console"). kitty reads no system-wide config, so wol-session
# links this file as ~/.config/kitty/kitty.conf when you have none (replace the link to make it
# yours; `kitty --config /usr/share/wolos/kitty/kitty.conf` starts it with these alone).
# Same font, padding and opacity as foot (desktop/overlay/usr/share/wolos/foot/foot.ini). The
# colours are the theme's, written by `wol theme` to ~/.config/wolos/toolkits/kitty/theme.conf
# (kitty logs a missing include and goes on; a user theme overrides).
font_family JetBrains Mono
font_size 11.0
window_padding_width 12
background_opacity 0.9
hide_window_decorations yes
confirm_os_window_close 0
shell_integration enabled
copy_on_select clipboard
scrollback_lines 100000
enable_audio_bell no
tab_bar_style powerline
tab_powerline_style round
# The default theme first, then yours (a later file wins).
include /usr/share/wolos/toolkits/kitty/theme.conf
include ~/.config/wolos/toolkits/kitty/theme.conf
