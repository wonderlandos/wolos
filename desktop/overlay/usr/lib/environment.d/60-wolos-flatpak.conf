# Flatpak asks this helper before an app gets its permissions (wol-flatpak-consent).
FLATPAK_WOLOS_CONSENT_HELPER=/usr/bin/wol-flatpak-consent
# Electron and Chromium apps use Wayland when the session has it, X11 otherwise.
ELECTRON_OZONE_PLATFORM_HINT=auto
# Java/AWT apps (JetBrains, Swing, Flatpak Java) under Xwayland: the compositor does not reparent windows.
_JAVA_AWT_WM_NONREPARENTING=1
