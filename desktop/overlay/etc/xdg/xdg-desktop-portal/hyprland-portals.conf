[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.FileChooser=gtk
# Settings (color-scheme, accent-color): gtk reads gsettings, which `wol theme` sets; Firefox (when installed),
# Helium and libadwaita follow it live.
org.freedesktop.impl.portal.Settings=gtk
# "Open with" and printing from a sandboxed app: gtk (hyprland implements neither).
org.freedesktop.impl.portal.AppChooser=gtk
org.freedesktop.impl.portal.Print=gtk
# Passwords of browsers and chat apps in a sandbox: gnome-keyring implements the Secret portal
# (the session starts its secrets component); neither hyprland nor gtk does, so an app asking got no
# answer (IMAGE-F).
org.freedesktop.impl.portal.Secret=gnome-keyring
