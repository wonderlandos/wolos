<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- WolOS: "Inter" (tokens, GTK, Qt, hyprbars) resolves to Inter Variable; Inter is the default sans. -->
<fontconfig>
  <alias binding="same"><family>Inter</family><prefer><family>Inter Variable</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Inter Variable</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>Inter Variable</family></prefer></alias>
</fontconfig>
