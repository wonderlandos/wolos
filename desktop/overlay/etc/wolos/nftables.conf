#!/usr/bin/nft -f
# SPDX-License-Identifier: GPL-2.0-or-later
# Copyright (c) 2026 Julia Klee
#
# WolOS firewall (Settings > Network > Firewall; nftables.service). Nothing comes in unasked;
# replies to this machine's own traffic pass through connection tracking.
#
# This file owns the table `inet wolos` and nothing else. It never flushes the whole ruleset:
# that would also delete `inet wol_tor` and `inet wol_tor_apps` (the Tor scopes' redirect and
# drop rules, ADR 0056), and every reload of this firewall would take Tor off the machine's
# traffic until the next boot. `destroy table` replaces only our own table, in the same
# transaction as the table below, so there is no moment without rules.
destroy table inet wolos

table inet wolos {
	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		iif "lo" accept
		# Ping and "unreachable" (path MTU discovery needs fragmentation-needed).
		icmp type { echo-request, destination-unreachable } accept
		# IPv6 does not work without neighbour discovery and router advertisements; too-big is its path MTU.
		icmpv6 type { echo-request, destination-unreachable, packet-too-big, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept
		# DHCP and DHCPv6: the server answers the lease request.
		udp sport 67 udp dport 68 accept
		udp sport 547 udp dport 546 accept
		# mDNS: printers and other devices on the local network announce themselves. Only to the
		# mDNS multicast groups: a unicast query to port 5353 from a host that can route here gets no answer.
		ip daddr 224.0.0.251 udp dport 5353 accept
		ip6 daddr ff02::fb udp dport 5353 accept
		# Unicast replies to a question asked with the "unicast response" bit (RFC 6762 5.4) come from
		# port 5353 with TTL / hop limit 255, which only a host on this link can send.
		ip ttl 255 udp sport 5353 udp dport 5353 accept
		ip6 hoplimit 255 udp sport 5353 udp dport 5353 accept
		# What a setting opens while it is on (Remote Login: nftables.d/ssh.conf, port 22).
		include "/etc/wolos/nftables.d/*.conf"
	}
	chain forward {
		type filter hook forward priority filter; policy drop;
	}
	chain output {
		type filter hook output priority filter; policy accept;
	}
}
