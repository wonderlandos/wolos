// WolOS AutoConfig (first line is skipped). Firefox follows the WolOS theme: `wol theme` writes
// $XDG_CONFIG_HOME/wolos/toolkits/firefox/wolos-chrome.css; this registers it as a user sheet
// (browser window + new tab only, see the file) and re-registers it when it changes, so theme
// and light/dark switches apply live. Prefs are defaults: about:config still wins.
defaultPref("toolkit.legacyUserProfileCustomizations.stylesheets", true);
defaultPref("widget.use-xdg-desktop-portal.settings", 1);
defaultPref("browser.tabs.inTitlebar", 1);
defaultPref("browser.compactmode.show", true);
defaultPref("browser.uidensity", 1);
defaultPref("browser.toolbars.bookmarks.visibility", "never");
defaultPref("widget.gtk.native-context-menus", true);
defaultPref("browser.theme.native-theme", true);
defaultPref("layout.css.prefers-color-scheme.content-override", 2);

(function () {
  const REL = "wolos/toolkits/firefox/wolos-chrome.css";
  const SYSTEM = "/usr/share/wolos/firefox/wolos-chrome.css";
  const POLL_MS = 1000;
  const Ci = Components.interfaces;
  const sss = Components.classes["@mozilla.org/content/style-sheet-service;1"]
    .getService(Ci.nsIStyleSheetService);
  let current = null;
  let stamp = "";

  function file(path) {
    const f = Components.classes["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
    f.initWithPath(path);
    return f;
  }

  function sheet() {
    const xdg = getenv("XDG_CONFIG_HOME");
    const home = getenv("HOME");
    const base = xdg ? xdg : home ? home + "/.config" : "";
    for (const p of [base ? base + "/" + REL : "", SYSTEM]) {
      if (!p) continue;
      try {
        const f = file(p);
        if (f.exists()) return f;
      } catch (e) {}
    }
    return null;
  }

  function sync() {
    try {
      const f = sheet();
      const next = f ? f.path + "@" + f.lastModifiedTime : "";
      if (next === stamp) return;
      if (current && sss.sheetRegistered(current, sss.USER_SHEET)) {
        sss.unregisterSheet(current, sss.USER_SHEET);
      }
      current = null;
      stamp = next;
      if (!f) return;
      // The query defeats the style sheet cache; file: URLs ignore it when reading.
      current = Services.io.newURI(Services.io.newFileURI(f).spec + "?" + f.lastModifiedTime);
      sss.loadAndRegisterSheet(current, sss.USER_SHEET);
    } catch (e) {
      Components.utils.reportError("wolos.cfg: " + e);
    }
  }

  sync();
  const timer = Components.classes["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
  timer.initWithCallback({ notify: sync }, POLL_MS, Ci.nsITimer.TYPE_REPEATING_SLACK);
  Services.obs.addObserver({ observe: sync }, "final-ui-startup");
  globalThis.wolosThemeTimer = timer;
})();
