# WolOS pacman.conf (ADR 0016): one Arch Linux Archive date per WolOS release, [wolos] first.
# A WolOS update moves every repo here to the next tested date; nothing rolls in between.
[options]
HoldPkg = pacman glibc
Architecture = auto
# The package database belongs to the slot (A/B, ADR 0016), not the shared @var.
DBPath = /usr/lib/pacman/
CheckSpace
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# WolOS: linux-wolos, hyprland-wolos, wolos-system. Signed with the WolOS key.
[wolos]
Server = https://repo.wolos.org/2026-10-20/$arch

[core]
Server = https://archive.archlinux.org/repos/2026/10/20/$repo/os/$arch

[extra]
Server = https://archive.archlinux.org/repos/2026/10/20/$repo/os/$arch

[multilib]
Server = https://archive.archlinux.org/repos/2026/10/20/$repo/os/$arch
