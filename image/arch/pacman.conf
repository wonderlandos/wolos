# WolOS pacman.conf (ADR 0016, ADR 0019): one date per WolOS release; the first repo that has a
# package wins: [wolos], then [wolos-cachy], then Arch. A WolOS update moves every repo here to the
# next tested date; nothing rolls in between.
[options]
HoldPkg = pacman glibc
Architecture = auto
# The package database belongs to the slot (A/B, ADR 0016), not the shared @var.
DBPath = /usr/lib/pacman/
CheckSpace
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# WolOS: kernel, Hyprland, system, apps. Signed with the WolOS key.
[wolos]
Include = /etc/pacman.d/wolos-mirrorlist

# x86-64-v3 builds of Arch packages at the same versions, frozen at the release. Turned on by
# `wol mirror gate` (installer, first boot) only on CPUs that run them.
#[wolos-cachy]
#Include = /etc/pacman.d/wolos-mirrorlist

[core]
Server = https://archive.archlinux.org/repos/2026/10/20/$repo/os/$arch

[extra]
Server = https://archive.archlinux.org/repos/2026/10/20/$repo/os/$arch

[multilib]
Server = https://archive.archlinux.org/repos/2026/10/20/$repo/os/$arch
