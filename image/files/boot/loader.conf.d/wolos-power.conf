# WolOS power (archicture/modules/power.md). PCI functions no driver claims go to D3 at boot; level
# 1 keeps storage, display, memory and base peripherals powered. A driver loaded later puts its
# device back in D0 first. Unclaimed devices (e.g. an audio DSP FreeBSD 15.1 has no driver for)
# otherwise stay in D0 and can keep the package out of deep idle states.
hw.pci.do_power_nodriver="1"
