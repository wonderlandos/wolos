# WolOS i915 (drm-612-kmod) tunables. Only read by i915kms: Intel-scoped. Values = evidence in
# archicture/modules/intel-graphics.md. All are upstream "unsafe" params: pinned at driver defaults, never forced on.
compat.linuxkpi.i915_enable_guc="0"    # FreeBSD default: GuC hangs reboot/poweroff (drm-kmod b2c91e6ebc)
compat.linuxkpi.i915_enable_fbc="-1"   # per-chip default (on for Gen9+)
compat.linuxkpi.i915_enable_psr="-1"   # per-chip default from VBT
compat.linuxkpi.i915_enable_dc="-1"    # deepest DC state the platform allows (needs DMC firmware)
