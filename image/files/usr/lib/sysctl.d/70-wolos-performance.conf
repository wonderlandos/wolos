# WolOS memory and latency tuning (kernel/README.md). Security settings: 90-wolos.conf.
# Swap is zram (compressed RAM): swapping is cheap, so swap idle pages early and read one page at a time.
vm.swappiness = 100
vm.page-cluster = 0
# Keep directory and inode caches longer (file pickers, builds, game asset scans).
vm.vfs_cache_pressure = 50
# Write back in small steps (64 MB background, 256 MB hard): no multi-second stalls when copying to USB.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
vm.dirty_writeback_centisecs = 1500
# The NMI watchdog wakes every CPU periodically for a lockup detector desktops do not need.
kernel.nmi_watchdog = 0
# Only errors reach the console (no driver chatter over the boot splash).
kernel.printk = 3 3 3 3
# Fast networks and many open files (games, browsers, Steam downloads).
net.core.netdev_max_backlog = 4096
fs.file-max = 2097152
