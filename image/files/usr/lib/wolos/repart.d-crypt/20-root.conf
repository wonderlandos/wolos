# WolOS installer, Encrypt disk: the same btrfs root as repart.d/20-root.conf inside a LUKS2 volume
# (argon2id). install-run gives it a throw-away key file; the real keys are enrolled afterwards.
[Partition]
Type=root
Label=WolOS
Format=btrfs
Encrypt=key-file
MakeDirectories=/@wolos-a /@home /@var
Subvolumes=/@wolos-a /@home /@var
