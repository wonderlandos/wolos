[package]
name = "wolkit"
version.workspace = true
edition.workspace = true
license = "BSD-2-Clause"
authors.workspace = true
description = "libWolkit: the WolOS UI engine behind a stable C ABI (wolkit.h, libwolkit.so.1)"

[lib]
name = "wolkit"
# libwolkit.so.1 is linked from the staticlib by link.sh, so abi/wolkit.map alone decides the
# exports (a cdylib would also get rustc's own unversioned export list).
crate-type = ["staticlib", "rlib"]

[dependencies]
shared.workspace = true
wol_core.workspace = true
libc.workspace = true
serde_json.workspace = true
harfrust = "0.15.0"
skrifa = "0.49.0"
unicode-bidi = "0.3.18"
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13.3"
# The native window backend (WK-W4): the Wayland client, keymaps and compose, and the accessibility bus.
# `system`: libwayland-client itself, so the GPU backend can hand its display and surface to Vulkan WSI.
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
xkbcommon = { version = "0.9", default-features = false, features = ["wayland"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
# Vulkan, loaded at run time (libvulkan.so.1 is dlopened, nothing links it): the GPU backend (WK-W5).
ash = { version = "0.38", default-features = false, features = ["loaded", "std"] }

[dev-dependencies]
miniz_oxide = "0.9.1"
# An in-process mock compositor for the native backend tests (the forge has no headless compositor).
wayland-server = "0.31"
wayland-protocols = { version = "0.32", features = ["server", "client", "staging", "unstable"] }

[[bench]]
name = "batch"
harness = false

[[bench]]
name = "gpu"
harness = false

[[bench]]
name = "layout"
harness = false

[[bench]]
name = "style"
harness = false

[[bench]]
name = "text"
harness = false
