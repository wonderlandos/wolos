[package]
name = "wolkit"
version.workspace = true
edition.workspace = true
license = "BSD-2-Clause"
authors.workspace = true
description = "libWolkit: the WolOS UI engine behind a stable C ABI (wolkit.h, libwolkit.so.1)"

[lib]
name = "wolkit"
# libwolkit.so.1 is linked from the staticlib by link.sh, so abi/wolkit.map alone decides the
# exports (a cdylib would also get rustc's own unversioned export list).
crate-type = ["staticlib", "rlib"]

[dependencies]
shared.workspace = true
wol_core.workspace = true
libc.workspace = true
serde_json.workspace = true
harfrust = "0.15.0"
skrifa = "0.49.0"
unicode-bidi = "0.3.18"
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13.3"

[dev-dependencies]
