[package]
name = "controller"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
wol_lua = { path = "../wol-lua", package = "wol-lua" }
shared.workspace = true
# `tls`: `wol doctor tls` probes WolOS's own Rust TLS stack (wol_core::net::probe, ADR 0055).
wol_core = { workspace = true, features = ["tls"] }
serde.workspace = true
serde_json.workspace = true
libc.workspace = true

[[bin]]
name = "wol"
path = "src/bin/wol.rs"

[[bin]]
name = "pacman"
path = "src/bin/pacman.rs"

[[bin]]
name = "wol-login"
path = "src/bin/wol-login.rs"

[[bin]]
name = "wol-session-pam"
path = "src/bin/wol-session-pam.rs"

[[bin]]
name = "wol-authcheck"
path = "src/bin/wol-authcheck.rs"
