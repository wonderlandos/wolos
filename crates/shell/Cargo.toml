[package]
name = "shell"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
authors.workspace = true
description = "WolOS shell UI: menu bar, dock, notifications, control center, spotlight, lock, login, settings"

[features]
default = []
# Real shell surfaces + ext-session-lock. Needs the gtk4-layer-shell >= 1.2 C library
# (FreeBSD: x11-toolkits/gtk4-layer-shell); the image builds with `--features layer-shell`.
# Dev host: build v1.2.0 into ~/Documentos/hyprland-deps/prefix, PKG_CONFIG_PATH=<prefix>/lib/pkgconfig.
# Off (default, keeps `cargo test --workspace` green on hosts without it): plain windows for dev.
layer-shell = ["dep:gtk4-layer-shell", "dep:gtk4-session-lock"]

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_16"] }
gtk4-layer-shell = { version = "0.8", optional = true }
gtk4-session-lock = { version = "0.4", optional = true, features = ["v1_2"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
shared.workspace = true
wol_core.workspace = true
serde.workspace = true
serde_json.workspace = true
async-channel = "2"
# wol-window-shot: hyprland_toplevel_export_v1 client (Mission Control thumbnails).
wayland-client = "0.31"
wayland-scanner = "0.31"
wayland-backend = "0.3"
bitflags = "2"

[[test]]
name = "golden"
harness = false

[dev-dependencies]
async-io = "2"
blocking = "1"
futures-lite = "2"
