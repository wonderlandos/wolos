[package]
name = "wol-lua"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Lua desktop widgets on libwol: sandboxed scripts that return Kit view trees"

[dependencies]
shared.workspace = true
wol-abi = { path = "../wol-abi" }
libc.workspace = true
# Lua 5.4, built from source (MIT): no system Lua needed, same interpreter everywhere.
mlua = { version = "0.12", features = ["lua54", "vendored"] }
