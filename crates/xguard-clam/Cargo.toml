[package]
name = "xguard-clam"
version = "0.1.0"
edition = "2024"
# Our source; the binary built with `libclamav` links a GPL-2.0-only library and is GPL-2.0-only.
license = "GPL-2.0-or-later"
description = "wol-xguard-clam: the full signature engine in its own process, asked through a socket (ADR 0028)"
publish = false

[[bin]]
name = "wol-xguard-clam"
path = "src/main.rs"

[features]
# Off by default so a plain workspace build needs no libclamav headers or library.
libclamav = []

[dependencies]
libc = "0.2"
