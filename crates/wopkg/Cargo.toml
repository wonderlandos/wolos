[package]
name = "wopkg"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "libwopkg: WolOS package index, downloads, trust checks and transactions behind a stable C ABI (ADR 0021)"

[lib]
name = "wopkg"
# libwopkg.so.1 is linked from the staticlib by link.sh (abi/wopkg.map decides the exports);
# the rlib is for Rust callers (the App Store).
crate-type = ["staticlib", "rlib"]

[dependencies]
shared.workspace = true
wol_core.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
flate2 = "1.1"
ruzstd = "0.8"
quick-xml = "0.41"
memchr = "2.8"
memmap2 = "0.9"
md4 = "0.10"
sha1 = "0.10"
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }

[dev-dependencies]
flate2 = "1.1"
serde_json.workspace = true
