# How NetworkManager tells "online" from "limited" and a captive portal (a cafe's sign-in page),
# which WolOS shows in the menu bar, Control Center, Settings > Network, `wol network` and the app
# facts (QA-NET-12, NET2-3). The probe is a plain-http GET of one fixed text file every 5 minutes
# and after each change of network; nothing about the computer is sent beyond the request itself.
# It goes to Arch Linux's server (the one Arch's own 20-connectivity.conf names): WolOS has no
# endpoint of its own yet, and an https or redirecting one would read as a portal everywhere.
# Turn it off with `enabled=false` in /etc/NetworkManager/conf.d (no portal notice then).
[connectivity]
enabled=true
uri=http://ping.archlinux.org/nm-check.txt
response=NetworkManager is online
interval=300
