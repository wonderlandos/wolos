# No text consoles for people: the WolOS login window owns the screen (tty1).
[Login]
NAutoVTs=0
ReserveVT=0
# Nothing an account started keeps running after it logs out (QA-FILES-2): a program left behind
# could watch the next person's session on a shared computer. `loginctl enable-linger NAME` keeps
# one account's own services.
KillUserProcesses=yes
