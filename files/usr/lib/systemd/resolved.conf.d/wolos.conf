# avahi answers .local (printers, AirPlay, Bonjour); two mDNS stacks make both unreliable. .local
# names reach avahi through nss-mdns, which /etc/nsswitch.conf asks before `resolve`
# (wolos-system's /usr/lib/wolos/nsswitch-mdns; QA-NET-4). Every other name still goes through
# systemd-resolved, so DNS-over-TLS and DNSSEC set here apply to every program.
[Resolve]
MulticastDNS=no
# No compiled-in fallback servers (Quad9, Cloudflare, Google): when the network names none, names
# do not resolve, instead of going to a third party nobody chose (QA-NET-4).
FallbackDNS=
