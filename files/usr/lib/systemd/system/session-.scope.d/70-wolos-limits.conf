# The compositor, the shell and the portals live here; app windows move to their own scopes (ADR 0027).
[Scope]
CPUWeight=1000
MemoryMin=256M
TasksMax=4096
# Never the pick of systemd-oomd (user@.service.d has the kill setting): losing Hyprland or wol-shell
# ends the session and every window with it.
ManagedOOMPreference=omit
