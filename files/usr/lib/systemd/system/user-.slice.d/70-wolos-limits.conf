# All of one user: enough for several heavy apps. memory.min reaches the session only through here.
[Slice]
MemoryMin=256M
TasksMax=16384
# A memory hog started from the session dies inside this slice (the kernel kills within the cgroup
# whose limit is hit, by oom_score_adj: the compositor and the shell sit at -900, wold sets that).
# Without a limit it was the machine's memory that ran out, and the kernel's pick among every
# process was logind, seatd and wold, not the hog (QA L2-30). Below `user@.service`'s own 80 %.
MemoryMax=90%
