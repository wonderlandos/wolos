# NetworkManager does Wi-Fi through iwd (/etc/NetworkManager/conf.d/wolos-iwd.conf): iwd runs
# whenever NetworkManager does, on the live medium too (its units come from the package scriptlet,
# not from 50-wolos.preset).
[Unit]
Wants=iwd.service
After=iwd.service
