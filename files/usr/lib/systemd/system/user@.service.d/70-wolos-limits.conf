# Background services and `systemd-run --user` jobs share one app's limits (ADR 0027).
[Service]
TasksMax=8192
MemoryMax=80%
MemorySwapMax=25%
# The hog is stopped by systemd-oomd (enabled in 50-wolos.preset) when the memory pressure of the user
# manager's cgroup stays high, before the machine freezes in swap: a 4 GB machine with one browser
# at 3 GB stalled for minutes before the kernel killed anything (QA-ACC-22). oomd picks among the
# descendants of a cgroup that has this setting, by memory pressure (pgscan rate) and size, so it is
# set here, on the user manager (app scopes and background services), and not on the user slice, whose
# children include the login session scope with the compositor and the shell (session-.scope.d omits it).
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
