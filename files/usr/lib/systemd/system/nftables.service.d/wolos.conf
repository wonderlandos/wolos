# The WolOS firewall (Settings > Network > Firewall); /etc/nftables.conf stays nftables' own.
# A oneshot that loads a ruleset must stay "active" after it ran: otherwise `systemctl disable
# --now` has nothing to stop (Firewall off left every rule loaded, QA-NET-1), reload says "not
# active" (Remote Login's rule never loaded, QA-NET-3) and Settings reads "not running now" on
# every boot (QA-NET-2). Stopping the unit takes the table out.
[Service]
Type=oneshot
RemainAfterExit=yes
ExecStart=
ExecStart=/usr/bin/nft -f /etc/wolos/nftables.conf
ExecReload=
ExecReload=/usr/bin/nft -f /etc/wolos/nftables.conf
ExecStop=
ExecStop=-/usr/bin/nft delete table inet wolos
