# bluetoothd comes back by itself after a crash or a kill (QA-SYS-8): Arch's unit has no Restart=,
# so a dead bluetoothd left Control Center and Settings > Bluetooth without a word until the next
# boot. The shell shows "Bluetooth isn't running" with Turn On meanwhile; Turn On runs the admin
# action `bluetooth on` (systemctl reset-failed + start), because bluetoothctl as the user cannot
# start the service: it waits for org.bluez, which nothing activates, for ever. After five
# failures in a minute (StartLimitBurst below) the unit stays failed until that reset-failed.
[Unit]
StartLimitIntervalSec=60
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=2
