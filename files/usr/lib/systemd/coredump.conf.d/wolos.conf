# WolOS: no core files (a crashed compositor left a 27 MB core in a home folder). Crash details:
# the journal (coredumpctl info). systemd-coredump still reads a core up to 64 MiB, the shell or
# compositor size, for its stack trace, then drops it; with 0 it read nothing and every crash said
# "terminated abnormally without generating a coredump" (QA-CRASH-4).
[Coredump]
Storage=none
ProcessSizeMax=64M
