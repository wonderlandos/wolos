# WolOS memory tuning (kernel/README.md).
# MGLRU: keep the last second of working set resident; under pressure the OOM killer acts instead of thrashing.
w! /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000
# Hugepages on request (madvise); defrag only for those requests, never in the page-fault path of others.
w! /sys/kernel/mm/transparent_hugepage/defrag - - - - defer+madvise
w! /sys/kernel/mm/transparent_hugepage/khugepaged/max_ptes_none - - - - 409
