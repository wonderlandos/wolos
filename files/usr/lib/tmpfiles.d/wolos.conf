d /var/lib/wolos 0755 root root -
d /var/lib/wolos/updates 0755 root root -
# Airplane mode's list of the radios that were on (netconf::AIRPLANE_SHARED_DIR): every account
# writes it, because the radios belong to the computer (QA-A7-13). Group `seat` (every account
# WolOS makes is in it, settings::users::ACCOUNT_GROUPS), not 0777: a directory every uid can write,
# without the sticky bit, lets a service or a guest replace the list (QA-A9-CORE-7). Not sticky: the
# next person's toggle replaces the one shared file.
d /var/lib/wolos/airplane 2775 root seat -
# The administrator's package caches and wopkg's state: root's home is in the sealed, read-only
# slot (QA-STORE-62; controller packages::ROOT_CACHE, wopkg context ROOT_CACHE/STATE/DATA).
d /var/cache/wolos 0755 root root -
d /var/cache/wolos/packages 0755 root root -
# `wol pkg -Sw` works in a scratch copy of the package database and removes it at the end; one
# killed half way leaves it, and nothing else would (QA-A7-18). It cannot outlive a restart.
R /var/tmp/wolos-download-db.*
d /var/cache/wopkg 0755 root root -
d /var/lib/wolos/wopkg 0700 root root -
d /var/lib/wolos/wopkg/state 0700 root root -
d /var/lib/wolos/wopkg/data 0700 root root -
# The malware check (audit F10): _xguard (full database, background pass) may write the top
# folder, which is sticky so it cannot move or replace root's; the guard's own folder is root's
# alone, with the signatures it loads (rules/, local/); the pass has its own. Files from before
# the split are removed, never adopted.
d /var/lib/wolos/xguard 1775 root _xguard -
d /var/lib/wolos/xguard/guard 0755 root root -
d /var/lib/wolos/xguard/sweep 0755 _xguard _xguard -
r /var/lib/wolos/xguard/verdicts
r /var/lib/wolos/xguard/status.json
r /var/lib/wolos/xguard/findings-*.json
r /var/lib/wolos/xguard/sweep-*
R /var/lib/wolos/xguard/rules
R /var/lib/wolos/xguard/local
