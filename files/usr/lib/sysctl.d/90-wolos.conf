# WolOS kernel settings (wol_core::security::HARDENING, docs/modules/security.md).
# The kernel log (addresses, devices, USB serials) is for administrators.
kernel.dmesg_restrict = 1
# Kernel addresses stay hidden, also from administrators' tools.
kernel.kptr_restrict = 2
# A process may only trace its own children (an app cannot read another app's memory).
kernel.yama.ptrace_scope = 1
# No kernel debugger from a key chord on the keyboard.
kernel.sysrq = 0
# No hard or symbolic link tricks in shared folders.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
# No core files from setuid programs.
fs.suid_dumpable = 0
# No creating files or writing FIFOs another account owns in shared sticky folders like /tmp.
fs.protected_fifos = 1
fs.protected_regular = 1
# Only administrators load BPF programs into the kernel (wol_core::security::HARDENING wants 1).
kernel.unprivileged_bpf_disabled = 1
# BPF programs of ordinary accounts are compiled with constant blinding (1: root's scheduler
# programs such as scx_wolos keep their speed).
net.core.bpf_jit_harden = 1
# A flood of half-open connections cannot exhaust the network stack.
net.ipv4.tcp_syncookies = 1
# Only administrators create io_uring instances; apps fall back to ordinary reads and writes.
# Interim until the 7.3.1 kernel lands (its stable fixes close the io_uring CVEs of 7.3.0, audit8
# cve #2); remove this line with that kernel bump.
kernel.io_uring_disabled = 1
# No replacing the running kernel without a restart through the firmware (Secure Boot stays whole).
kernel.kexec_load_disabled = 1
# Games (Proton, some engines) map more regions than the default allows.
vm.max_map_count = 2147483642
