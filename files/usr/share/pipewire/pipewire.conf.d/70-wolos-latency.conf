# The graph may go down to 64 frames (1.3 ms) for a stream that asks for it (games, Pro Audio); 1024
# is the default and 2048 the ceiling. In a VM (cpu.vm.name set) PipeWire's own
# context.properties.rules in pipewire.conf raise the floor to 1024 after this fragment, so a guest
# does not underrun; WolOS keeps that (its pulse fragment does the same for PulseAudio clients).
# `pw-metadata -n settings 0` shows the floor in effect (clock.min-quantum).
# allowed-rates: the graph follows a 44.1 kHz or a 96 kHz stream instead of resampling it (CD rips,
# DAW sessions); 48000 stays the default for everything else. Settings > Sound > Pro Audio writes
# clock.force-rate / clock.force-quantum into ~/.config/pipewire/pipewire.conf.d/50-wolos-pro-audio.conf.
context.properties = {
    default.clock.rate = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 ]
    default.clock.quantum = 1024
    default.clock.min-quantum = 64
    default.clock.max-quantum = 2048
}
