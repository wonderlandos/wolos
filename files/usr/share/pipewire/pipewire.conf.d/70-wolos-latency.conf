# Low-latency defaults for games; minimum stays at 64 frames (1.3 ms) so VMs and USB DACs do not underrun.
# allowed-rates: the graph follows a 44.1 kHz or a 96 kHz stream instead of resampling it (CD rips,
# DAW sessions); 48000 stays the default for everything else. Settings > Sound > Pro Audio writes
# clock.force-rate / clock.force-quantum into ~/.config/pipewire/pipewire.conf.d/50-wolos-pro-audio.conf.
context.properties = {
    default.clock.rate = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 ]
    default.clock.quantum = 1024
    default.clock.min-quantum = 64
    default.clock.max-quantum = 2048
}
