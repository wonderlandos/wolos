# PulseAudio clients: the floor is 256 frames (5.3 ms, upstream's since 1.5.82) for every client, so a
# browser or a chat app cannot drag the whole graph down to 64 frames and make it crackle. Only games
# (Wine/Proton, Steam, gamescope) may ask for 64 frames (1.3 ms). In a VM the floor is 1024 frames.
pulse.properties = {
    pulse.min.req = 256/48000
    pulse.min.quantum = 256/48000
    pulse.default.req = 512/48000
}

pulse.properties.rules = [
    {
        matches = [
            { cpu.vm.name = !null }
        ]
        actions = {
            update-props = {
                pulse.min.req = 1024/48000
                pulse.min.quantum = 1024/48000
            }
        }
    }
]

pulse.rules = [
    {
        matches = [
            { application.process.binary = "~wine.*" }
            { application.process.binary = "~steam.*" }
            { application.process.binary = "~gamescope.*" }
            { application.name = "~wine.*" }
        ]
        actions = {
            update-props = {
                pulse.min.req = 64/48000
                pulse.min.quantum = 64/48000
            }
        }
    }
]
