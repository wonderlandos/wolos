# Bluetooth: best codec first (LDAC, aptX, AAC, then SBC-XQ), mSBC for call quality, device volume buttons.
# Calls go through PipeWire's own HFP/HSP backend (no oFono/hsphfpd); LDAC picks its bitrate from the link.
monitor.bluez.properties = {
    bluez5.enable-sbc-xq = true
    bluez5.enable-msbc = true
    bluez5.enable-hw-volume = true
    bluez5.hfphsp-backend = "native"
    bluez5.codecs = [ ldac aptx_hd aptx aac opus_05 sbc_xq sbc ]
}

monitor.bluez.rules = [
    {
        matches = [
            { device.name = "~bluez_card.*" }
        ]
        actions = {
            update-props = {
                bluez5.a2dp.ldac.quality = "auto"
            }
        }
    }
]
