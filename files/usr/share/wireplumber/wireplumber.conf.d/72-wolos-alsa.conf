# ALSA devices: the hardware mixer stays in charge (soft-mixer off) because USB interfaces expose
# their preamp gain only through it; the driver's dB table is trusted (ignore-dB off) so 0 dB is
# a real position on the slider; devices sleep after 5 s idle. Settings > Sound > Troubleshooting
# flips these per device ("Ignore hardware volume" -> soft-mixer true, "Keep device awake" ->
# suspend-timeout 0) in ~/.config/wireplumber/wireplumber.conf.d/, never here.
monitor.alsa.rules = [
    {
        matches = [
            { device.name = "~alsa_card.*" }
        ]
        actions = {
            update-props = {
                api.alsa.soft-mixer = false
                api.alsa.ignore-dB = false
            }
        }
    }
    {
        matches = [
            { node.name = "~alsa_input.*" }
            { node.name = "~alsa_output.*" }
        ]
        actions = {
            update-props = {
                session.suspend-timeout-seconds = 5
            }
        }
    }
]
