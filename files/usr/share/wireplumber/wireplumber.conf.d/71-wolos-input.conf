# Microphones start quiet, not at hardware maximum. WirePlumber's default for a new source is 1.0
# (100%): on most codecs the ALSA mixer merges Capture and Mic Boost into that one slider, so 100%
# is +20..+30 dB of boost and the voice clips. 0.064 is 40% on the cubic slider (0.4^3), the same
# start sinks get. wol-audio then snaps each new device once to its volumeBase (0 dB) and Settings
# shows 100% as 0 dB; louder needs the explicit "Allow louder" toggle (docs/modules/audio.md).
# Headsets switch to the HFP/HSP profile only while an app records (Settings toggle); when the
# profile is chosen automatically the better codec wins over the lower-latency one.
# The input level meter in Settings (stream "wolos-meter") sets node.link-group so this autoswitch
# ignores it: opening Sound must not move headphones to HFP (crates/audio model::METER_PROPS).
wireplumber.settings = {
    device.routes.default-source-volume = 0.064
    bluetooth.autoswitch-to-headset-profile = true
    bluetooth.profile-preference = "quality"
}
