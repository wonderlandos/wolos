# Ameba (the Crystal linter) for every tracked .cr file; docs/RULES-crystal.md RCR-003.
# Run: tools/crystal/lint.sh  (crystal tool format --check, then ameba --up-to-version 1.7.0).
#
# Every rule ameba 1.7.0 ships is listed with an explicit Enabled: a rule added by a newer ameba
# is not in this file, so rules_crystal.rs RCR-003 fails until someone decides it here, and
# lint.sh passes --up-to-version so a newer ameba does not switch rules on behind our back.
# Excluded: lists under a rule are the baseline for that rule (the legacy files that still break
# it). They only shrink: RCR-004 fails when one grows or when a file is listed that no longer breaks the rule.
# The scanner fixtures under crates/controller/tests/fixtures/crystal are bad on purpose and are
# never passed to ameba.
Globs:
  - "**/*.cr"
  - "!lib"
  - "!crates/controller/tests/fixtures"

Documentation/Admonition:
  Enabled: false

Documentation/Documentation:
  Enabled: false

Layout/LineLength:
  Enabled: false

Layout/TrailingBlankLines:
  Enabled: true

Layout/TrailingWhitespace:
  Enabled: true

Lint/AmbiguousAssignment:
  Enabled: true

Lint/AssignmentInCallArgument:
  Enabled: true

Lint/BadDirective:
  Enabled: true

Lint/ComparisonToBoolean:
