<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doctor</title>
  <link rel="stylesheet" href="../kit/wolkit.css">
  <link rel="stylesheet" href="app.css">
  <script src="../kit/dev.js" data-dev="../kit/mock-bridge.js ../kit/fixtures.js fixtures.js"></script>
  <script src="../kit/bridge.js"></script>
  <script src="strings.js"></script>
  <script defer src="../kit/wolkit.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <wol-app>
    <wol-sidebar id="areas" data-t-label="nav.label">
      <a href="#all"><span data-t="area.all">All checks</span><wol-badge data-count="all" hidden></wol-badge></a>
      <a href="#sound"><span data-t="area.sound">Sound</span><wol-badge data-count="sound" hidden></wol-badge></a>
      <a href="#games"><span data-t="area.games">Games</span><wol-badge data-count="games" hidden></wol-badge></a>
      <a href="#updates"><span data-t="area.updates">Updates</span><wol-badge data-count="updates" hidden></wol-badge></a>
      <a href="#security"><span data-t="area.security">Security</span><wol-badge data-count="security" hidden></wol-badge></a>
      <a href="#storage"><span data-t="area.storage">Storage</span><wol-badge data-count="storage" hidden></wol-badge></a>
      <a href="#network"><span data-t="area.network">Network</span><wol-badge data-count="network" hidden></wol-badge></a>
      <a href="#power"><span data-t="area.power">Power</span><wol-badge data-count="power" hidden></wol-badge></a>
      <a href="#display"><span data-t="area.display">Displays</span><wol-badge data-count="display" hidden></wol-badge></a>
    </wol-sidebar>
    <main>
      <header class="wk-header">
        <div>
          <h1 id="title" data-t="area.all">All checks</h1>
          <p id="lead" data-t="lead.all"></p>
          <p id="summary" class="dr-summary"></p>
        </div>
        <wol-button id="again" kind="primary"><span data-t="again">Check again</span></wol-button>
      </header>
      <wol-progress id="checking" data-t-label="checking" hidden></wol-progress>
      <wol-empty id="fine" hidden>
        <p id="fine-time"></p>
        <wol-button id="fine-toggle" kind="quiet"><span data-t="empty.show">Show the checks</span></wol-button>
      </wol-empty>
      <div id="lists"></div>
      <wol-empty id="error" hidden>
        <p id="error-text"></p>
        <p id="error-checked"></p>
        <p id="error-next" data-t="error.next"></p>
        <details id="error-more" class="dr-cmd">
          <summary data-t="error.more">Show what happened</summary>
          <p data-t="error.raw"></p>
          <code id="error-raw"></code>
          <p data-t="command.check"></p>
          <code>wol doctor</code>
        </details>
        <wol-button id="retry"><span data-t="error.retry">Try again</span></wol-button>
      </wol-empty>
      <p id="announce" class="wk-visually-hidden" role="status" aria-live="polite"></p>
    </main>
  </wol-app>
</body>
</html>
